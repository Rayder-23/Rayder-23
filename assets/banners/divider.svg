<svg viewBox="0 0 1200 4" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="divider">
  <style>
    .track { fill: url(#lineGrad); }
    @media (prefers-color-scheme: dark) {
      .track { fill: url(#lineGradDark); }
    }
  </style>
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="lineGradDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B21B6"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#5B21B6"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect class="track" x="0" y="0" width="1200" height="4"/>

  <!-- small nod to data science: pulsing "nodes" along the wire -->
  <circle cx="240" cy="2" r="1.3" fill="#FFFFFF">
    <animate attributeName="r" values="1.3;2.2;1.3" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="2" r="1.3" fill="#FFFFFF">
    <animate attributeName="r" values="1.3;2.2;1.3" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="960" cy="2" r="1.3" fill="#FFFFFF">
    <animate attributeName="r" values="1.3;2.2;1.3" dur="2.6s" begin="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" begin="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
